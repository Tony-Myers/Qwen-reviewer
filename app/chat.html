<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local LLM</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f0; --surface: #ffffff; --surface-alt: #edece7;
    --text: #1a1a18; --text-muted: #6b6962;
    --accent: #2d5a27; --accent-light: #e8f0e6;
    --user-bg: #2d5a27; --user-text: #ffffff;
    --assistant-bg: #ffffff; --border: #d4d2cb;
    --shadow: 0 1px 3px rgba(0,0,0,0.06); --radius: 10px;
    --error: #9b2c2c; --error-bg: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18; --surface: #262622; --surface-alt: #2e2e2a;
      --text: #e8e6df; --text-muted: #8a877e;
      --accent: #6abf5e; --accent-light: #2a3d28;
      --user-bg: #3a7a32; --user-text: #f0f0ec;
      --assistant-bg: #262622; --border: #3a3a36;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --error: #f87171; --error-bg: #3b1c1c;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  header h1 { font-family: 'Source Serif 4', serif; font-size: 1.15rem; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .status { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); transition: background 0.3s; }
  .dot.connected { background: var(--accent); }
  .field-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }
  .compact-input, .model-select { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); outline: none; }
  .compact-input { width: 70px; }
  .model-select { width: min(280px, 42vw); }
  .restart-note { min-width: 92px; max-width: 220px; font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--surface-alt); flex-shrink: 0; }
  .tab { padding: 9px 22px; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .panel.active { display: flex; }
  #chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  .message { max-width: 720px; width: 100%; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .message.user { align-self: flex-end; }
  .message.assistant { align-self: flex-start; }
  .message .role { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; color: var(--text-muted); }
  .message.user .role { text-align: right; }
  .message .bubble { padding: 11px 15px; border-radius: var(--radius); line-height: 1.55; font-size: 0.9rem; box-shadow: var(--shadow); }
  .message.user .bubble { background: var(--user-bg); color: var(--user-text); border-bottom-right-radius: 3px; }
  .message.assistant .bubble { background: var(--assistant-bg); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .message .bubble pre { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; background: var(--surface-alt); padding: 10px 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--border); }
  .message .bubble code { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; background: var(--surface-alt); padding: 1px 5px; border-radius: 3px; }
  .message .bubble pre code { background: none; padding: 0; }
  .message.error .bubble { background: var(--error-bg); border: 1px solid var(--error); color: var(--error); }
  .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
  .typing-indicator span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
  #input-area { padding: 14px 24px; border-top: 1px solid var(--border); background: var(--surface); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  #input-area textarea { flex: 1; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); resize: none; outline: none; min-height: 42px; max-height: 160px; line-height: 1.45; transition: border-color 0.15s; }
  #input-area textarea:focus { border-color: var(--accent); }
  .btn { font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 600; padding: 10px 18px; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; }
  .btn:hover { opacity: 0.88; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); font-weight: 500; font-size: 0.78rem; padding: 6px 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; border-radius: var(--radius); transition: all 0.15s; }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 8px; }
  .empty-state h2 { font-family: 'Source Serif 4', serif; font-size: 1.25rem; font-weight: 600; color: var(--text); }
  .empty-state p { font-size: 0.86rem; }
  .review-layout { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .upload-area { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .drop-zone { width: 100%; max-width: 520px; border: 2px dashed var(--border); border-radius: 12px; padding: 32px 20px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-light); }
  .drop-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop-zone h3 { font-family: 'Source Serif 4', serif; font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
  .drop-zone p { font-size: 0.8rem; color: var(--text-muted); }
  .drop-zone .file-name { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--accent); margin-top: 6px; font-weight: 500; }
  .progress-area { padding: 16px 24px; flex-shrink: 0; display: none; border-bottom: 1px solid var(--border); background: var(--surface-alt); }
  .progress-area.visible { display: block; }
  .progress-bar-track { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
  .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }
  .progress-log { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-muted); max-height: 100px; overflow-y: auto; line-height: 1.6; }
  .report-area { flex: 1; overflow-y: auto; padding: 24px; }
  .report-content { max-width: 780px; margin: 0 auto; line-height: 1.65; font-size: 0.9rem; }
  .report-content h1 { font-family: 'Source Serif 4', serif; font-size: 1.35rem; font-weight: 600; margin: 24px 0 10px; }
  .report-content h2 { font-family: 'Source Serif 4', serif; font-size: 1.1rem; font-weight: 600; margin: 20px 0 8px; }
  .report-content h3 { font-size: 0.95rem; font-weight: 600; margin: 16px 0 6px; }
  .report-content ul { margin: 6px 0 6px 20px; }
  .report-content li { margin-bottom: 4px; }
  .report-content code { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; background: var(--surface-alt); padding: 1px 5px; border-radius: 3px; }
  .report-content hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .report-actions { max-width: 780px; margin: 16px auto 0; display: flex; gap: 10px; padding-bottom: 24px; }
</style>
</head>
<body>

<header>
  <h1>Local LLM</h1>
  <div class="header-right">
    <label class="field-label" for="modelSelect">Model:</label>
    <select class="model-select" id="modelSelect"></select>
    <button class="btn-secondary" id="restartBtn" onclick="restartWithSelectedModel()">Restart</button>
    <span class="restart-note" id="restartNote"></span>
    <label class="field-label" for="maxTokens">Tokens:</label>
    <input type="number" id="maxTokens" value="1200" min="200" max="8192" step="200"
      class="compact-input">
    <button class="btn-secondary" id="clearBtn" onclick="clearChat()">Clear</button>
    <div class="status"><div class="dot" id="statusDot"></div><span id="statusText">Checking...</span></div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('chat')">Chat</button>
  <button class="tab" onclick="switchTab('review')">Review</button>
</div>

<div class="panel active" id="panel-chat">
  <div id="chat-container">
    <div class="empty-state" id="emptyState"><h2>Ready to chat</h2><p>Type a message below to start.</p></div>
  </div>
  <div id="input-area">
    <textarea id="userInput" rows="1" placeholder="Type a message..." autofocus></textarea>
    <button class="btn" id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<div class="panel" id="panel-review">
  <div class="review-layout">
    <div class="upload-area">
      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md,.csv,.xlsx">
        <h3>Upload manuscript</h3>
        <p>PDF, DOCX, TXT, MD, CSV, or XLSX</p>
        <div class="file-name" id="fileName" style="display:none"></div>
      </div>
      <div><button class="btn" id="reviewBtn" onclick="startReview()" disabled>Start review</button></div>
    </div>
    <div class="progress-area" id="progressArea">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressBar"></div></div>
      <div class="progress-log" id="progressLog"></div>
    </div>
    <div class="report-area" id="reportArea">
      <div class="empty-state"><h2>No review yet</h2><p>Upload a manuscript and press Start review.</p></div>
    </div>
  </div>
</div>

<script>
const BASE = window.location.origin;
let chatHistory = [], isGenerating = false, selectedFile = null, isRestarting = false;

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.textContent.toLowerCase() === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
  if (name === 'chat') document.getElementById('userInput').focus();
}

async function checkServer() {
  try {
    const r = await fetch(BASE + '/v1/models', { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      const d = await r.json();
      const currentModel = d?.data?.[0]?.id || 'connected';
      document.getElementById('statusDot').className = 'dot connected';
      document.getElementById('statusText').textContent = currentModel;
      syncSelectedModel(currentModel);
      return currentModel;
    }
  } catch {}
  document.getElementById('statusDot').className = 'dot'; document.getElementById('statusText').textContent = 'Server not reachable';
  return '';
}

function setRestartNote(text, isError) {
  const el = document.getElementById('restartNote');
  el.textContent = text || '';
  el.style.color = isError ? 'var(--error)' : 'var(--text-muted)';
}

function setControlsDisabled(disabled) {
  document.getElementById('restartBtn').disabled = disabled;
  document.getElementById('modelSelect').disabled = disabled;
  document.getElementById('sendBtn').disabled = disabled || isGenerating;
  document.getElementById('reviewBtn').disabled = disabled || !selectedFile;
  document.getElementById('clearBtn').disabled = disabled;
}

function syncSelectedModel(currentModel) {
  const select = document.getElementById('modelSelect');
  if (!select.options.length) return;
  select.dataset.currentModel = currentModel;
  const match = [...select.options].find(o => o.dataset.model === currentModel);
  if (match && select.value !== match.value && !isRestarting) select.value = match.value;
}

async function loadModelChoices() {
  const select = document.getElementById('modelSelect');
  try {
    const r = await fetch(BASE + '/api/models/aliases', { signal: AbortSignal.timeout(3000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    select.innerHTML = '';
    for (const m of d.models || []) {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.dataset.model = m.model;
      opt.textContent = m.label;
      select.appendChild(opt);
    }
    if (d.current_model && ![...select.options].some(o => o.dataset.model === d.current_model)) {
      const opt = document.createElement('option');
      opt.value = d.current_model;
      opt.dataset.model = d.current_model;
      opt.textContent = d.current_model;
      select.appendChild(opt);
    }
    syncSelectedModel(d.current_model || '');
  } catch (e) {
    select.innerHTML = '<option value="">Model list unavailable</option>';
    setRestartNote('No model list', true);
  }
}

async function restartWithSelectedModel() {
  const select = document.getElementById('modelSelect');
  const opt = select.selectedOptions[0];
  if (!opt || !select.value || isRestarting) return;
  if (opt.dataset.model === select.dataset.currentModel) {
    setRestartNote('Already loaded');
    return;
  }

  isRestarting = true;
  setControlsDisabled(true);
  setRestartNote('Restarting...');
  chatHistory = [];

  try {
    const r = await fetch(BASE + '/api/server/restart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: select.value }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    if (d.status === 'unchanged') {
      setRestartNote('Already loaded');
      isRestarting = false;
      setControlsDisabled(false);
      return;
    }
    await waitForRestart(d.model || opt.dataset.model);
  } catch (e) {
    setRestartNote(e.message, true);
    isRestarting = false;
    setControlsDisabled(false);
  }
}

async function waitForRestart(expectedModel) {
  const deadline = Date.now() + 2700000;
  let reached = false;
  while (Date.now() < deadline) {
    await new Promise(resolve => setTimeout(resolve, 2000));
    const current = await checkServer();
    if (current && (!expectedModel || current === expectedModel)) {
      reached = true;
      break;
    }
  }

  isRestarting = false;
  setControlsDisabled(false);
  if (reached) {
    clearChat();
    setRestartNote('Ready');
    setTimeout(() => setRestartNote(''), 2500);
    loadModelChoices();
  } else {
    setRestartNote('Still loading', true);
  }
}

loadModelChoices();
checkServer(); setInterval(() => { if (!isRestarting) checkServer(); }, 15000);

const userInput = document.getElementById('userInput');
userInput.addEventListener('input', () => { userInput.style.height = 'auto'; userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px'; });
userInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtMd(t) {
  t = t.replace(/```(\w*)\n([\s\S]*?)```/g, (_,l,c) => '<pre><code>' + esc(c.trim()) + '</code></pre>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');
  return t.replace(/\n/g, '<br>');
}

function addMsg(role, content, err) {
  document.getElementById('emptyState')?.remove();
  const d = document.createElement('div'); d.className = 'message ' + role + (err ? ' error' : '');
  d.innerHTML = '<div class="role">' + (role === 'user' ? 'You' : 'Assistant') + '</div><div class="bubble">' + fmtMd(content) + '</div>';
  const c = document.getElementById('chat-container'); c.appendChild(d); c.scrollTop = c.scrollHeight;
}
function addTyping() {
  document.getElementById('emptyState')?.remove();
  const d = document.createElement('div'); d.className = 'message assistant'; d.id = 'typing';
  d.innerHTML = '<div class="role">Assistant</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  const c = document.getElementById('chat-container'); c.appendChild(d); c.scrollTop = c.scrollHeight;
}
function rmTyping() { document.getElementById('typing')?.remove(); }

async function sendMessage() {
  const t = userInput.value.trim(); if (!t || isGenerating) return;
  isGenerating = true; document.getElementById('sendBtn').disabled = true;
  addMsg('user', t); userInput.value = ''; userInput.style.height = 'auto';
  chatHistory.push({ role: 'user', content: t }); addTyping();
  try {
    const r = await fetch(BASE + '/v1/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: chatHistory, max_tokens: parseInt(document.getElementById('maxTokens').value) || 1200, temperature: 0.4, top_p: 0.9 }) });
    rmTyping();
    if (!r.ok) { addMsg('assistant', 'Server error ' + r.status, true); chatHistory.pop(); }
    else { const d = await r.json(); const reply = d.choices?.[0]?.message?.content || '(empty)'; addMsg('assistant', reply); chatHistory.push({ role: 'assistant', content: reply }); }
  } catch (e) { rmTyping(); addMsg('assistant', 'Could not reach server: ' + e.message, true); chatHistory.pop(); }
  isGenerating = false; document.getElementById('sendBtn').disabled = false; userInput.focus();
}

function clearChat() {
  chatHistory = [];
  document.getElementById('chat-container').innerHTML = '<div class="empty-state" id="emptyState"><h2>Ready to chat</h2><p>Type a message below to start.</p></div>';
}

// --- File upload ---
const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
fileInput.addEventListener('change', () => { if (fileInput.files.length) pickFile(fileInput.files[0]); });
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; pickFile(e.dataTransfer.files[0]); } });

function pickFile(f) {
  selectedFile = f;
  const el = document.getElementById('fileName'); el.textContent = f.name; el.style.display = 'block';
  document.getElementById('reviewBtn').disabled = false;
}

// --- Review ---
async function startReview() {
  if (!selectedFile) return;
  const btn = document.getElementById('reviewBtn'); btn.disabled = true;
  const pa = document.getElementById('progressArea'); pa.classList.add('visible');
  const pb = document.getElementById('progressBar'); pb.style.width = '0%';
  const pl = document.getElementById('progressLog'); pl.innerHTML = '';
  const ra = document.getElementById('reportArea'); ra.innerHTML = '';

  const fd = new FormData(); fd.append('file', selectedFile); fd.append('domain', 'general');
  try {
    const r = await fetch(BASE + '/api/review', { method: 'POST', body: fd });
    if (!r.ok) { showErr('Upload failed: ' + r.status); btn.disabled = false; return; }
    const { job_id } = await r.json();
    const es = new EventSource(BASE + '/api/review/status/' + job_id);
    let steps = 0;
    es.onmessage = ev => {
      const d = JSON.parse(ev.data);
      if (d.type === 'progress') { steps++; pb.style.width = Math.min(steps * 8, 95) + '%'; const l = document.createElement('div'); l.textContent = d.message; pl.appendChild(l); pl.scrollTop = pl.scrollHeight; }
      if (d.type === 'complete') { es.close(); pb.style.width = '100%'; showReport(d.report, d.has_appendix, job_id); btn.disabled = false; }
      if (d.type === 'error') { es.close(); showErr(d.message); btn.disabled = false; }
    };
    es.onerror = () => { es.close(); showErr('Lost connection to server.'); btn.disabled = false; };
  } catch (e) { showErr('Request failed: ' + e.message); btn.disabled = false; }
}

let currentJobId = null;

function showReport(md, hasAppendix, jobId) {
  const ra = document.getElementById('reportArea');
  ra._raw = md;
  ra._rawAppendix = '';
  currentJobId = jobId || null;
  let html = '<div class="report-content">' + renderMd(md) + '</div>'
    + '<div class="report-actions">'
    + '<button class="btn-secondary" onclick="dlReport()">Download review .md</button>'
    + '<button class="btn-secondary" onclick="copyReport()">Copy review</button>';
  if (hasAppendix) {
    html += '<button class="btn-secondary" id="appendixToggle" onclick="fetchAndToggleAppendix()">Show evidence appendix</button>'
      + '<button class="btn-secondary" onclick="dlAppendix()">Download appendix .md</button>';
  }
  html += '</div>';
  html += '<div id="appendixSection" style="display:none; margin-top: 16px;"></div>';
  ra.innerHTML = html;
}

async function fetchAppendix() {
  if (!currentJobId) return '';
  const ra = document.getElementById('reportArea');
  if (ra._rawAppendix) return ra._rawAppendix;
  try {
    const resp = await fetch(BASE + '/api/review/appendix/' + currentJobId);
    if (resp.ok) {
      const data = await resp.json();
      ra._rawAppendix = data.appendix || '';
      return ra._rawAppendix;
    }
  } catch (e) { console.error('Failed to fetch appendix:', e); }
  return '';
}

async function fetchAndToggleAppendix() {
  const sec = document.getElementById('appendixSection');
  const btn = document.getElementById('appendixToggle');
  if (!sec) return;

  if (sec.style.display !== 'none') {
    sec.style.display = 'none';
    if (btn) btn.textContent = 'Show evidence appendix';
    return;
  }

  // Fetch if not yet loaded
  if (!sec.innerHTML) {
    if (btn) btn.textContent = 'Loading...';
    const md = await fetchAppendix();
    if (md) {
      sec.innerHTML = '<div class="report-content">' + renderMd(md) + '</div>';
    } else {
      sec.innerHTML = '<div class="report-content" style="color:var(--text-muted)">Could not load appendix.</div>';
    }
  }

  sec.style.display = 'block';
  if (btn) btn.textContent = 'Hide evidence appendix';
  sec.scrollIntoView({ behavior: 'smooth' });
}
function showErr(m) { document.getElementById('reportArea').innerHTML = '<div class="report-content" style="color:var(--error)">' + esc(m) + '</div>'; }

function renderMd(md) {
  let h = esc(md);
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_,l,c) => '<pre><code>' + c + '</code></pre>');
  h = h.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/^---$/gm, '<hr>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/^\* (.+)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>[\s\S]*?<\/li>\n?)+/g, m => '<ul>' + m + '</ul>');
  h = h.replace(/\n\n/g, '</p><p>');
  h = '<p>' + h + '</p>';
  h = h.replace(/<p>\s*<(h[1-4]|ul|hr|pre)/g, '<$1');
  h = h.replace(/<\/(h[1-4]|ul|hr|pre)>\s*<\/p>/g, '</$1>');
  return h;
}

function dlReport() {
  const md = document.getElementById('reportArea')._raw || '';
  const b = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  const name = selectedFile ? selectedFile.name.replace(/\.[^.]+$/, '') : 'review';
  a.href = URL.createObjectURL(b); a.download = name + '_review.md'; a.click();
}
function copyReport() {
  const md = document.getElementById('reportArea')._raw || '';
  navigator.clipboard.writeText(md).then(() => {
    const btns = document.querySelectorAll('.report-actions button');
    const b = btns[1]; if (b) { b.textContent = 'Copied!'; setTimeout(() => b.textContent = 'Copy review', 1500); }
  });
}

async function dlAppendix() {
  let md = document.getElementById('reportArea')._rawAppendix || '';
  if (!md) md = await fetchAppendix();
  if (!md) { alert('Appendix not available.'); return; }
  const b = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  const name = selectedFile ? selectedFile.name.replace(/\.[^.]+$/, '') : 'review';
  a.href = URL.createObjectURL(b); a.download = name + '_evidence_appendix.md'; a.click();
}
