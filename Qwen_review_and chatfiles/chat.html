<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Qwen Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f0;
    --surface: #ffffff;
    --surface-alt: #edece7;
    --text: #1a1a18;
    --text-muted: #6b6962;
    --accent: #2d5a27;
    --accent-light: #e8f0e6;
    --user-bg: #2d5a27;
    --user-text: #ffffff;
    --assistant-bg: #ffffff;
    --border: #d4d2cb;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --radius: 10px;
    --error: #9b2c2c;
    --error-bg: #fef2f2;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --surface: #262622;
      --surface-alt: #2e2e2a;
      --text: #e8e6df;
      --text-muted: #8a877e;
      --accent: #6abf5e;
      --accent-light: #2a3d28;
      --user-bg: #3a7a32;
      --user-text: #f0f0ec;
      --assistant-bg: #262622;
      --border: #3a3a36;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
      --error: #f87171;
      --error-bg: #3b1c1c;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header .status {
    font-size: 0.78rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  header .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s;
  }
  header .dot.connected { background: var(--accent); }

  .toolbar {
    padding: 8px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-alt);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .toolbar label {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .toolbar input, .toolbar select {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    outline: none;
  }

  .toolbar input:focus, .toolbar select:focus {
    border-color: var(--accent);
  }

  .toolbar input[type="text"] { width: 340px; }
  .toolbar input[type="number"] { width: 70px; }

  .toolbar button {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .toolbar button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  #chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .message {
    max-width: 720px;
    width: 100%;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user {
    align-self: flex-end;
  }

  .message.assistant {
    align-self: flex-start;
  }

  .message .role {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
    color: var(--text-muted);
  }

  .message.user .role { text-align: right; }

  .message .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 0.92rem;
    box-shadow: var(--shadow);
  }

  .message.user .bubble {
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 3px;
  }

  .message.assistant .bubble {
    background: var(--assistant-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }

  .message .bubble pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    background: var(--surface-alt);
    padding: 10px 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
    border: 1px solid var(--border);
  }

  .message .bubble code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.84rem;
    background: var(--surface-alt);
    padding: 1px 5px;
    border-radius: 3px;
  }

  .message .bubble pre code {
    background: none;
    padding: 0;
  }

  .message.error .bubble {
    background: var(--error-bg);
    border: 1px solid var(--error);
    color: var(--error);
  }

  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }
  .typing-indicator span {
    width: 6px; height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  #input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #input-area textarea {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 160px;
    line-height: 1.45;
    transition: border-color 0.15s;
  }

  #input-area textarea:focus {
    border-color: var(--accent);
  }

  #input-area button {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  #input-area button:hover { opacity: 0.88; }
  #input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    gap: 8px;
  }

  .empty-state h2 {
    font-family: 'Source Serif 4', serif;
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--text);
  }

  .empty-state p { font-size: 0.88rem; }
</style>
</head>
<body>

<header>
  <h1>Local Qwen Chat</h1>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Checking server...</span>
  </div>
</header>

<div class="toolbar">
  <label>Server:</label>
  <input type="text" id="serverUrl" value="http://localhost:8080" placeholder="http://localhost:8080">
  <label>Tokens:</label>
  <input type="number" id="maxTokens" value="1200" min="100" max="8192" step="100">
  <button onclick="clearChat()">Clear chat</button>
</div>

<div id="chat-container">
  <div class="empty-state" id="emptyState">
    <h2>Ready to chat</h2>
    <p>Start the server, then type a message below.</p>
  </div>
</div>

<div id="input-area">
  <textarea id="userInput" rows="1" placeholder="Type a message..." autofocus></textarea>
  <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<script>
const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const emptyState = document.getElementById('emptyState');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const serverUrlInput = document.getElementById('serverUrl');
const maxTokensInput = document.getElementById('maxTokens');

let history = [];
let isGenerating = false;

// Auto-resize textarea
userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
});

// Enter to send, Shift+Enter for newline
userInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Check server status
async function checkServer() {
  try {
    const base = serverUrlInput.value.replace(/\/+$/, '');
    const resp = await fetch(base + '/v1/models', { signal: AbortSignal.timeout(3000) });
    if (resp.ok) {
      const data = await resp.json();
      const modelName = data?.data?.[0]?.id || 'connected';
      statusDot.className = 'dot connected';
      statusText.textContent = modelName;
      return true;
    }
  } catch {}
  statusDot.className = 'dot';
  statusText.textContent = 'Server not reachable';
  return false;
}

checkServer();
setInterval(checkServer, 15000);
serverUrlInput.addEventListener('change', checkServer);

function addMessage(role, content, isError = false) {
  if (emptyState) emptyState.remove();

  const div = document.createElement('div');
  div.className = `message ${role}${isError ? ' error' : ''}`;

  const roleLabel = document.createElement('div');
  roleLabel.className = 'role';
  roleLabel.textContent = role === 'user' ? 'You' : 'Assistant';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = formatContent(content);

  div.appendChild(roleLabel);
  div.appendChild(bubble);
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
  return bubble;
}

function addTypingIndicator() {
  if (emptyState) emptyState.remove();

  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'typing';

  const roleLabel = document.createElement('div');
  roleLabel.className = 'role';
  roleLabel.textContent = 'Assistant';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

  div.appendChild(roleLabel);
  div.appendChild(bubble);
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

function formatContent(text) {
  // Code blocks
  text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
    return `<pre><code>${escapeHtml(code.trim())}</code></pre>`;
  });
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Line breaks
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text || isGenerating) return;

  isGenerating = true;
  sendBtn.disabled = true;

  addMessage('user', text);
  userInput.value = '';
  userInput.style.height = 'auto';

  history.push({ role: 'user', content: text });

  addTypingIndicator();

  try {
    const base = serverUrlInput.value.replace(/\/+$/, '');
    const maxTok = parseInt(maxTokensInput.value) || 1200;

    const resp = await fetch(base + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: history,
        max_tokens: maxTok,
        temperature: 0.4,
        top_p: 0.9,
      }),
    });

    removeTypingIndicator();

    if (!resp.ok) {
      const errText = await resp.text();
      addMessage('assistant', `Server error ${resp.status}: ${errText}`, true);
      history.pop(); // remove failed user message from history
    } else {
      const data = await resp.json();
      const reply = data.choices?.[0]?.message?.content || '(empty response)';
      addMessage('assistant', reply);
      history.push({ role: 'assistant', content: reply });
    }
  } catch (err) {
    removeTypingIndicator();
    addMessage('assistant', `Could not reach server: ${err.message}`, true);
    history.pop();
  }

  isGenerating = false;
  sendBtn.disabled = false;
  userInput.focus();
}

function clearChat() {
  history = [];
  chatContainer.innerHTML = `
    <div class="empty-state" id="emptyState">
      <h2>Ready to chat</h2>
      <p>Start the server, then type a message below.</p>
    </div>`;
  userInput.focus();
}
</script>

</body>
</html>
